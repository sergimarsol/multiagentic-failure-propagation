[project]
name = "mafp"
version = "0.1.0"
description = "Failure propagation and recovery in multi-agent systems (CSE 291A, Option 5)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentdojo==0.1.35",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
# Reproducibility: resolve every (transitive) dependency as of this date (>= 2 weeks old).
exclude-newer = "2026-10-06T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
